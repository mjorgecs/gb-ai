<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de desejos</title>
<style type="text/css">
:root{
  --gap:16px;
  --ink:#1C1C1E;
  --muted:#8E8E93;
  --accent:#007AFF;
  --bg:#FFFFFF;
  --card:#F2F2F7;
  --line:#C6C6C8;
  --danger:#FF3B30;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.4;
  padding:var(--gap);
}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:22px}
.field{
  display:block;width:100%;
  padding:12px 14px;margin-bottom:8px;
  border:0;border-radius:10px;background:#fff;
  font-family:inherit;font-size:16px;color:var(--ink);
}
.field::placeholder{color:var(--muted)}
textarea.field{resize:none;min-height:64px}
.btn{
  display:block;width:100%;padding:14px;
  border:0;border-radius:10px;
  background:var(--accent);color:#fff;
  font-family:inherit;font-size:16px;font-weight:600;
  cursor:pointer;
}
.btn[disabled]{opacity:.4;cursor:default}
.count{
  font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px 2px;
}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
li:last-child{border-bottom:0}
.check{
  flex:0 0 24px;width:24px;height:24px;margin-top:2px;padding:0;
  border-radius:50%;border:2px solid var(--line);
  background:transparent;cursor:pointer;position:relative;
}
li.done .check{background:var(--accent);border-color:var(--accent)}
li.done .check:after{
  content:"";position:absolute;left:6px;top:2px;
  width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg);
}
.body{flex:1 1 auto;min-width:0}
.t{font-weight:600;word-wrap:break-word}
.a{color:var(--muted);font-size:14px}
.n{color:var(--muted);font-size:13px;margin-top:4px;white-space:pre-wrap;word-wrap:break-word}
li.done .t,li.done .a{text-decoration:line-through}
li.done .body{opacity:.45}
.del{
  flex:0 0 auto;background:none;border:0;color:var(--danger);
  font-size:14px;font-family:inherit;cursor:pointer;padding:2px;
}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:6px}
.warn{
  background:#FFF4E5;color:#8A5A00;border-radius:10px;
  padding:10px 12px;font-size:13px;margin-bottom:16px;display:none;
}
</style>
</head>
<body>

<div id="warn" class="warn">
  Este dispositivo n&atilde;o permite guardar dados. A lista funciona, mas
  desaparece ao fechar a aplica&ccedil;&atilde;o.
</div>

<div class="card">
  <input id="fTitle"  class="field" type="text" placeholder="T&iacute;tulo do livro" autocomplete="off">
  <input id="fAuthor" class="field" type="text" placeholder="Autor (opcional)" autocomplete="off">
  <textarea id="fNote" class="field" placeholder="Nota (opcional)"></textarea>
  <button id="addBtn" class="btn" disabled>Adicionar &agrave; lista</button>
</div>

<p class="count" id="countLabel"></p>
<ul id="list"></ul>
<div id="empty" class="empty" style="display:none">
  <strong>A tua lista est&aacute; vazia</strong>
  Adiciona os livros que andas &agrave; procura.
</div>

<script type="text/javascript">
/* ==========================================================
   LISTA DE DESEJOS  -  armazenamento no pr&oacute;prio dispositivo
   ----------------------------------------------------------
   A lista de cada utilizador fica guardada no telem&oacute;vel dele,
   sob a chave STORAGE_KEY abaixo. N&atilde;o &eacute; sincronizada entre
   dispositivos e desaparece se a app for desinstalada.
   ========================================================== */

var STORAGE_KEY = "rebook_wishlist_v1";

var items = [];
var canPersist = true;

var fTitle     = document.getElementById("fTitle");
var fAuthor    = document.getElementById("fAuthor");
var fNote      = document.getElementById("fNote");
var addBtn     = document.getElementById("addBtn");
var listEl     = document.getElementById("list");
var emptyEl    = document.getElementById("empty");
var countLabel = document.getElementById("countLabel");
var warnEl     = document.getElementById("warn");

function load(){
  try{
    var raw = window.localStorage.getItem(STORAGE_KEY);
    var parsed = raw ? JSON.parse(raw) : [];
    items = Object.prototype.toString.call(parsed) === "[object Array]" ? parsed : [];
  }catch(err){
    items = [];
    canPersist = false;
    warnEl.style.display = "block";
  }
}

function save(){
  if(!canPersist){ return; }
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }catch(err){
    canPersist = false;
    warnEl.style.display = "block";
  }
}

function render(){
  listEl.innerHTML = "";

  var pending = 0;
  for(var i = 0; i < items.length; i++){
    if(!items[i].done){ pending++; }
  }

  if(!items.length){
    emptyEl.style.display = "block";
    countLabel.textContent = "";
    return;
  }
  emptyEl.style.display = "none";
  countLabel.textContent = pending === 1
    ? "1 livro à procura"
    : pending + " livros à procura";

  for(var j = 0; j < items.length; j++){
    listEl.appendChild(row(items[j], j));
  }
}

function row(item, index){
  var li = document.createElement("li");
  if(item.done){ li.className = "done"; }

  var check = document.createElement("button");
  check.className = "check";
  check.setAttribute("aria-label", item.done ? "Marcar como em falta" : "Marcar como encontrado");
  check.onclick = function(){
    items[index].done = !items[index].done;
    save();
    render();
  };

  var body = document.createElement("div");
  body.className = "body";

  var t = document.createElement("div");
  t.className = "t";
  t.textContent = item.title;          // textContent, never innerHTML: user input
  body.appendChild(t);

  if(item.author){
    var a = document.createElement("div");
    a.className = "a";
    a.textContent = item.author;
    body.appendChild(a);
  }
  if(item.note){
    var n = document.createElement("div");
    n.className = "n";
    n.textContent = item.note;
    body.appendChild(n);
  }

  var del = document.createElement("button");
  del.className = "del";
  del.textContent = "Remover";
  del.onclick = function(){
    items.splice(index, 1);
    save();
    render();
  };

  li.appendChild(check);
  li.appendChild(body);
  li.appendChild(del);
  return li;
}

function refreshAddState(){
  addBtn.disabled = !fTitle.value.trim();
}

function add(){
  var title = fTitle.value.trim();
  if(!title){ return; }

  items.unshift({
    title:  title,
    author: fAuthor.value.trim(),
    note:   fNote.value.trim(),
    done:   false,
    added:  Date.now()
  });

  fTitle.value = "";
  fAuthor.value = "";
  fNote.value = "";
  refreshAddState();
  save();
  render();
  fTitle.focus();
}

fTitle.addEventListener("input", refreshAddState);
fTitle.addEventListener("keydown", function(e){
  if(e.key === "Enter"){ e.preventDefault(); add(); }
});
addBtn.addEventListener("click", add);

load();
render();
refreshAddState();
</script>
</body>
</html>
